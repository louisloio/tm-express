<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />

    <!-- PWA manifest (Android/Chrome install + standalone display) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- iOS "Add to Home Screen" standalone mode — Safari only honors its own
         apple-* meta tags for this, not the manifest above, so both are
         needed. apple-mobile-web-app-capable is what actually hides the
         Safari chrome (address bar, tab bar) once launched from the home
         screen icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TM Express" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="color-scheme" content="light dark" />
    <title>TM Express</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
